name: PowerShell safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-rules:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test refusal cases and parser with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Test-PolicyRules.ps1
      - name: Test refusal cases and parser with PowerShell 7
        shell: pwsh
        run: ./tests/Test-PolicyRules.ps1
      - name: Test constrained rules with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ExecutionContext.SessionState.LanguageMode = 'ConstrainedLanguage'
          ./tests/Test-PolicyRules.ps1 -SkipParserCheck
      - name: Test constrained rules with PowerShell 7
        shell: pwsh
        run: |
          $ExecutionContext.SessionState.LanguageMode = 'ConstrainedLanguage'
          ./tests/Test-PolicyRules.ps1 -SkipParserCheck
